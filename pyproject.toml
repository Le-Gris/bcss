[project]
name = "bcss"
version = "1.0.0"
description = "Behavior-Conditioned Symbolic Synthesis (BCSS): synthesizing DSL programs that explain human and machine errors on ARC tasks."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "hodel_dsl/LICENSE"]
authors = [
    { name = "Solim LeGris", email = "solim.legris@nyu.edu" },
    { name = "Philipp Mondorf" },
    { name = "Jinran Jin" },
    { name = "Akshay K. Jagadish" },
    { name = "Brenden M. Lake" },
    { name = "Todd M. Gureckis" },
]
dependencies = [
    "google-genai>=1.62.0",
    "litellm>=1.81.8",
    "matplotlib",
    "networkx",
    "numpy",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.1.3",
    "tqdm",
]

[project.optional-dependencies]
analysis = [
    "polars",
    "pyarrow",
    "arviz<1.0",
    "bambi",
    "pymc",
    "numpyro",
    "jax",
    "scipy",
]

[project.urls]
Repository = "https://github.com/Le-Gris/bcss"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
